# Credential patterns to detect hardcoded secrets (cross-provider)
credential_patterns:
  - name: "Generic API Key"
    pattern: "(?i)(api[_-]?key|apikey)\\s*[=:]\\s*['\"]?([A-Za-z0-9\\-_]{20,})['\"]?"
    risk_level: critical
    description: "Hardcoded API key detected"
  - name: "Bearer Token"
    pattern: "(?i)bearer\\s+([A-Za-z0-9\\-_.~+/]+=*)"
    risk_level: critical
    description: "Hardcoded Bearer token detected"
  - name: "OpenAI Key Pattern"
    pattern: "sk-[A-Za-z0-9]{20,}"
    risk_level: critical
    description: "Hardcoded OpenAI API key detected"
  - name: "Anthropic Key Pattern"
    pattern: "sk-ant-[A-Za-z0-9\\-_]{20,}"
    risk_level: critical
    description: "Hardcoded Anthropic API key detected"
  - name: "HuggingFace Token"
    pattern: "hf_[A-Za-z0-9]{20,}"
    risk_level: critical
    description: "Hardcoded HuggingFace token detected"

# NIST AI RMF function definitions
nist_rmf_functions:
  GOVERN-1:
    name: "Govern: Policies and Accountability"
    description: "Establish organizational policies, roles, and accountability for AI risk management."
  GOVERN-2:
    name: "Govern: Culture and Workforce"
    description: "Foster organizational culture and workforce readiness for responsible AI."
  MAP-1:
    name: "Map: Categorize AI Context"
    description: "Identify and categorize the AI system's context, purpose, and intended use."
  MAP-3:
    name: "Map: AI System Risk Classification"
    description: "Classify AI system risks based on potential harms and deployment context."
  MAP-4:
    name: "Map: Third-Party Dependencies"
    description: "Identify and assess risks from third-party AI components and supply chain."
  MAP-5:
    name: "Map: Potential Harms"
    description: "Identify potential harms to individuals, groups, or society from AI system outputs."
  MEASURE-1:
    name: "Measure: Risk Metrics"
    description: "Define and collect metrics to evaluate AI risk exposure."
  MEASURE-2:
    name: "Measure: Evaluate Trustworthiness"
    description: "Evaluate AI system trustworthiness characteristics including bias, robustness, and privacy."
  MANAGE-1:
    name: "Manage: Risk Treatment"
    description: "Apply risk treatment strategies including mitigation, transfer, and acceptance."
  MANAGE-2:
    name: "Manage: Controls Implementation"
    description: "Implement technical and governance controls for identified AI risks."
  MANAGE-3:
    name: "Manage: Monitor and Review"
    description: "Continuously monitor AI risks and review effectiveness of controls."

# CTEM exposure category definitions
ctem_categories:
  external_exposure:
    name: "External Exposure"
    description: "AI service APIs exposed to or called from external networks."
    severity_modifier: 1.2
  data_exfiltration:
    name: "Data Exfiltration Risk"
    description: "Sensitive data transmitted to third-party AI provider infrastructure."
    severity_modifier: 1.5
  third_party_dependency:
    name: "Third-Party Dependency"
    description: "Critical dependency on external AI provider availability and reliability."
    severity_modifier: 1.1
  cloud_dependency:
    name: "Cloud Platform Dependency"
    description: "Dependency on cloud-platform-specific AI services creating lock-in risk."
    severity_modifier: 1.0
  supply_chain:
    name: "AI Supply Chain Risk"
    description: "Risk from open-source models or components with unclear provenance."
    severity_modifier: 1.2
  identity_access:
    name: "Identity and Access Risk"
    description: "Inadequate identity and access management for AI service credentials."
    severity_modifier: 1.3
  open_source_risk:
    name: "Open Source Model Risk"
    description: "Risks associated with open-source AI models including licensing and safety."
    severity_modifier: 0.9
  biometric_data:
    name: "Biometric Data Processing"
    description: "Processing of biometric data (voice, face, fingerprint) by AI services."
    severity_modifier: 1.8
