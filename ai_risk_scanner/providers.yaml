# AI Risk Scanner - Provider Signature Database
# Version: 1.0.0
#
# This file defines known AI providers, their detection patterns,
# and associated risk metadata used by the detection engine.
#
# Schema per provider entry:
#   id: unique snake_case identifier
#   name: human-readable display name
#   category: type of AI service (llm, image_gen, speech, embedding, mlops, cloud_ai)
#   risk_level: baseline risk level (critical, high, medium, low)
#   vendor_lock_in: boolean indicating proprietary API lock-in
#   data_residency_concern: boolean indicating cross-border data transfer risk
#   patterns:
#     imports: list of import/require patterns
#     env_vars: list of environment variable name patterns
#     urls: list of URL/endpoint patterns
#     model_names: list of model name patterns
#     sdk_calls: list of SDK method/class patterns
#   nist_rmf_functions: list of applicable NIST AI RMF function IDs
#   ctem_categories: list of applicable CTEM exposure categories
#   compliance_notes: list of compliance concern strings
#   docs_url: reference URL for provider documentation

providers:

  - id: openai
    name: OpenAI
    category: llm
    risk_level: high
    vendor_lock_in: true
    data_residency_concern: true
    patterns:
      imports:
        - "import openai"
        - "from openai"
        - "require('openai')"
        - "require(\"openai\")"
        - "from 'openai'"
        - "from \"openai\""
      env_vars:
        - "OPENAI_API_KEY"
        - "OPENAI_ORG_ID"
        - "OPENAI_ORGANIZATION"
        - "OPENAI_BASE_URL"
        - "OPENAI_API_BASE"
      urls:
        - "api.openai.com"
        - "openai.com/v1"
      model_names:
        - "gpt-4o"
        - "gpt-4-turbo"
        - "gpt-4"
        - "gpt-3.5-turbo"
        - "gpt-3.5"
        - "o1-preview"
        - "o1-mini"
        - "o1"
        - "o3"
        - "text-davinci"
        - "text-embedding-ada"
        - "text-embedding-3"
        - "dall-e-3"
        - "dall-e-2"
        - "whisper-1"
        - "tts-1"
      sdk_calls:
        - "openai.ChatCompletion"
        - "openai.Completion"
        - "openai.Embedding"
        - "openai.Image"
        - "openai.Audio"
        - "client.chat.completions"
        - "client.completions"
        - "client.embeddings"
        - "OpenAI()"
        - "AsyncOpenAI()"
    nist_rmf_functions:
      - "GOVERN-1"
      - "MAP-1"
      - "MAP-5"
      - "MEASURE-2"
      - "MANAGE-1"
    ctem_categories:
      - "external_exposure"
      - "data_exfiltration"
      - "third_party_dependency"
    compliance_notes:
      - "Data processed by OpenAI may leave your jurisdiction"
      - "Review OpenAI data retention policies for sensitive workloads"
      - "Ensure API key rotation policy is in place"
      - "Audit prompt content for PII/PHI before transmission"
    docs_url: "https://platform.openai.com/docs"

